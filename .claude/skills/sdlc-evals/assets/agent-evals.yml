name: Agent evals
on:
  pull_request:   # no paths filter: a required check must report on every PR
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  evals:
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # each eval starts from an older commit
      - name: Detect agent configuration changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] ||
             git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(AGENTS\.md|CLAUDE\.md|\.claude/|evals/)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        if: steps.scope.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config --global user.name evals && git config --global user.email evals@example.com
          git config --global --add safe.directory '*'
          # The agent, and every check that runs its code, execute as `sandbox`: no sudo, and no
          # write access to the root-owned grading snapshot or to the runner's result files.
          sudo useradd --create-home sandbox
          sudo cp -r evals /opt/evals && sudo chown -R root:root /opt/evals && sudo chmod -R a-w,a+rX /opt/evals
          export CHECK_AS=sandbox
          failed=0
          for eval in /opt/evals/*.json; do
            out=$(mktemp -d)   # private to the runner user
            git clone -q --no-local . /tmp/run
            git -C /tmp/run checkout -q --detach "$(jq -r '.from' "$eval")"
            rm -rf /tmp/run/evals /tmp/run/.claude   # keep the checks out of the run's checkout
            for f in AGENTS.md CLAUDE.md .claude; do   # the configuration under test
              [ -e "$f" ] && cp -r "$f" /tmp/run/
            done
            git -C /tmp/run add -A && git -C /tmp/run commit -q --allow-empty -m "configuration under test"
            sudo chown -R sandbox: /tmp/run
            ( cd /tmp/run
              # shellcheck disable=SC2024 # the runner, not sandbox, owns the result file
              sudo --preserve-env=ANTHROPIC_API_KEY -u sandbox -H claude -p "$(jq -r '.prompt' "$eval")" \
                --allowedTools "Read,Edit,Bash(make test)" \
                --output-format json > "$out/result.json"
              sudo pkill -KILL -u sandbox || true   # nothing the agent started may outlive its run
              /opt/evals/check.sh "$eval" "$out/result.json" ) || failed=$((failed + 1))
            sudo pkill -KILL -u sandbox || true
            sudo rm -rf /tmp/run "$out"
          done
          echo "$failed eval(s) failed"
          [ "$failed" -eq 0 ]
