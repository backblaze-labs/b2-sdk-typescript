kind: Fixed
body: "**`.sdkharness` checks enforce the loopback contract themselves.** One shared guard (`.sdkharness/tests/lib/guard.cjs`) is used by every leaf and `health-golden-path`: simulator and control URLs must be `http://127.0.0.1:<port>` (`[::1]` is no longer accepted), only the fixed simulator credential is accepted (the health check refuses any other key), proxy variables are scrubbed, and failure messages carry the underlying reason. The README gains a \"run one check locally\" section and the guards have unit tests (`pnpm run test:sdkharness`). Known SDK findings the checks report (for example `large.multipart`, upload retries, `lock.bypass_governance`, `urls.native_download`) are unchanged and still fail."
