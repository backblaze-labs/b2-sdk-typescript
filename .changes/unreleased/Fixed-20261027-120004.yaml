kind: Fixed
body: "**`.sdkharness` `run-resilience` refuses a simulator that already served requests.** The resilience checks count the simulator's whole request journal, which has no reset, so on a simulator shared by several scenarios `upload.cap_exceeded_403` and `api.retry_after_503` read earlier scenarios' requests as their own and failed with a false SDK verdict. The dispatcher now fails with a `configuration` reason (`requireFreshSimulator` in `.sdkharness/tests/lib/guard.cjs`); the harness already starts a fresh simulator per scenario, so its results are unchanged."
