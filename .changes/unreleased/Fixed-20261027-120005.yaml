kind: Fixed
body: "**`.sdkharness` guard follow-ups.** A `dist/` that exists but lacks the file `package.json` exports for an import is now a `FAIL` (a moved or renamed build output is a regression); only an absent `dist/` is `COULD-NOT-RUN`. The `run-resilience` fresh-simulator guard now has dispatcher-level tests (used simulator, unreachable journal), and the dispatcher and leaf unit tests skip on Windows, where they cannot spawn shebang scripts, so `pnpm verify` stays portable. The four refusal assertions (`enc.sse_c`, `keys.multi_bucket`, `lock.legal_hold`, `lock.per_file_retention`) note that their error type, status and code values are simulator-derived and must be re-verified against real B2 before use outside the simulator. No verdict for a known SDK finding changes."
