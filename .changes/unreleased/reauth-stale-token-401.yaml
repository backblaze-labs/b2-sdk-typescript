kind: Fixed
body: "A request that gets an expired-token 401 after another request has already reauthorized now retries with the current token instead of calling `b2_authorize_account` again, so concurrent requests on one expired token cause one reauthorization. Applies to `B2Client` and the Partner and Backup clients. `RetryTransportOptions.onReauth` now also receives the token the failed request was sent with as an optional second argument."
time: 2026-11-26T00:00:00Z
