kind: Fixed
body: "A request that gets an expired-token 401 after the same client has already reauthorized away from the token it was sent with now retries with the current token instead of calling `b2_authorize_account` again, so concurrent requests on one expired token cause one automatic reauthorization per client. Applies to `B2Client` and the Partner and Backup clients. A token replaced outside automatic reauthorization, such as by calling `authorize()` directly or by another client sharing the same account info, still leads to a new reauthorization. `RetryTransportOptions.onReauth` now also receives the token the failed request was sent with as an optional second argument."
time: 2026-11-26T00:00:00Z
