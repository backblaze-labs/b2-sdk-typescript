name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
  schedule:
    - cron: '27 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pull request dependency metadata
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir audit-target
          for path in package.json pnpm-lock.yaml pnpm-workspace.yaml; do
            gh api \
              -H "Accept: application/vnd.github.raw" \
              "repos/${HEAD_REPO}/contents/${path}?ref=${HEAD_SHA}" > "audit-target/${path}"
          done

      - name: Checkout audit target
        if: ${{ github.event_name != 'pull_request_target' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: audit-target

      - name: Checkout trusted audit policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: audit-policy
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Test trusted audit wrapper
        working-directory: audit-policy
        run: node --test scripts/audit-dependencies.test.mjs

      - name: Validate dependency lockfile
        working-directory: audit-target
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Check dependency file changes
        id: dependency-changes
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > changed-files.txt
          if grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' changed-files.txt; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dependency audit
        id: dependency-audit
        continue-on-error: ${{ github.event_name == 'pull_request_target' && steps.dependency-changes.outputs.blocking != 'true' }}
        working-directory: audit-policy
        run: node scripts/audit-dependencies.mjs ../audit-target

      - name: Report non-blocking dependency audit failure
        if: ${{ github.event_name == 'pull_request_target' && steps.dependency-audit.outcome == 'failure' && steps.dependency-changes.outputs.blocking != 'true' }}
        run: echo "::warning::Dependency audit found a moderate-or-higher advisory in the existing dependency graph. Scheduled and post-merge audits remain blocking."

  github-actions:
    name: GitHub Actions security
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event_name != 'pull_request_target' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: backblaze-labs/github-actions/actions/gha-security@7dedd1467663493ccb5b5ca6d3a2533d3604f7b0 # v0.1.0
