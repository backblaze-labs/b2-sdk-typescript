name: Review metrics

# Weekly review-health report (docs/review-process.md): human approvals, human
# comments and waiting time per PR, automated review rounds, and the revert share
# as the guardrail. No pull_request trigger, so Dependabot never invokes it.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Window in days
        default: '30'

permissions:
  contents: read

jobs:
  review-metrics:
    name: review-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '30' }}
        run: node scripts/review-metrics.mjs "$DAYS"
