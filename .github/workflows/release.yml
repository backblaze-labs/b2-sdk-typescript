name: Release

# Tag-driven release. pnpm owns package versions; its version hook asks Changie
# to batch fragments for that exact version. Prepare with --no-git-tag-version
# in a release PR, then sign/tag the approved merge commit (see RELEASE.md).
# Publishing keeps npm OIDC trusted publishing and provenance.
#
# ENFORCE_SIGNED_TAGS defaults off while maintainers enroll public signing keys.
# Signature failures warn in that phase; security triage and milestone readiness
# remain required. The inspected tag commit must equal the immutable event SHA.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish; also select this tag as the workflow ref'
        required: true
      allow_registry_artifact_mismatch:
        description: 'Bootstrap-only: allow an existing npm artifact to differ from this verified tarball'
        required: false
        type: boolean
        default: false

# GitHub enforces cache-mode with scoped tokens, including on workflow_dispatch.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

permissions:
  contents: read # default read-only access; release publishing escalates below

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag)) || github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Verify release tag and milestone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      commit: ${{ steps.signature.outputs.commit }}
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag)) || github.ref }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Verify maintainer tag signature
        id: signature
        env:
          ENFORCE_SIGNED_TAGS: ${{ vars.ENFORCE_SIGNED_TAGS }}
        run: node scripts/verify-release-tag.mjs "$REF"
      - name: Verify release milestone readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-milestone.mjs "$REF"

  security:
    name: Release security triage
    environment: release-security
    needs: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag)) || github.ref }}
    steps:
      - name: Checkout trusted security policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Check release security triage
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECURITY_TOKEN }}
          RELEASE_SECURITY_APPROVAL: ${{ secrets.RELEASE_SECURITY_APPROVAL }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-security-check.mjs "$REF"

  build:
    name: Verify release artifact
    needs: [release-policy, security]
    runs-on: ubuntu-latest
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag)) || github.ref }}
    steps:
      # `pnpm test` runs files against the standalone b2-simulator, a private
      # repository read with a read-only deploy key. The key is used here, before
      # the release commit is checked out, so no code from that commit runs while
      # the key is in reach. The commit repeats SIMULATOR_PIN in
      # scripts/b2-simulator/pin.mjs (a test keeps the two equal) and is checked
      # against it below. The checkout moves out of the workspace because the
      # release checkout empties the workspace.
      - name: Check out the pinned b2-simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backblaze-labs/b2-simulator
          ref: a1e1db373b71f2d5f40082c19bc716cb6b3c3675
          ssh-key: ${{ secrets.SIMULATOR_DEPLOY_KEY }}
          persist-credentials: false
          path: .b2-simulator
      - name: Move the b2-simulator out of the workspace
        id: simulator
        run: |
          mv "$GITHUB_WORKSPACE/.b2-simulator" "$RUNNER_TEMP/b2-simulator"
          echo "dir=$RUNNER_TEMP/b2-simulator" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The tag must match the version in package.json, or the published
      # artifact and the tag would disagree. `pnpm version` keeps them in sync;
      # this guards against a hand-pushed tag that drifted.
      - name: Verify tag matches package.json version
        run: |
          RELEASE_TAG="${REF#refs/tags/}"
          VERSION="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag '$RELEASE_TAG' (version $VERSION) does not match package.json version $PKG."
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches package.json version: $PKG"

      # Pre-publish gate. CI (ci.yml) already runs the full matrix on every
      # push/PR; we repeat the cheap, critical checks here so a tag pushed from
      # an unverified state can't publish a broken build.
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify the b2-simulator revision
        env:
          B2SIM_DIR: ${{ steps.simulator.outputs.dir }}
        run: |
          checked_out="$(git -C "$B2SIM_DIR" rev-parse HEAD)"
          pinned="$(node scripts/b2-simulator/pin.mjs)"
          if [ "$checked_out" != "$pinned" ]; then
            echo "::error::This workflow checked out b2-simulator $checked_out, but the release commit's scripts/b2-simulator/pin.mjs pins $pinned. The workflow file and the tag disagree, which happens when a tag made before a pin bump is dispatched from another ref; dispatch the workflow from the tag itself."
            exit 1
          fi
          test -z "$(git -C "$B2SIM_DIR" status --short)"
      - run: pnpm test
        env:
          B2SIM_DIR: ${{ steps.simulator.outputs.dir }}
      - name: Build release artifact
        run: pnpm run build:release
      - name: Assert release User-Agent channel
        run: pnpm run verify:release-channel -- --published
      - run: pnpm run verify:metadata
      - run: pnpm run verify:release
      - run: pnpm run verify:exports

      - name: Verify tracked files are unchanged before packing
        run: |
          if ! git diff --exit-code; then
            echo "::error::Tracked files changed after release verification; refusing to pack."
            exit 1
          fi

      - name: Pack verified release artifact
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          mkdir -p .release
          RELEASE_TAG="${REF#refs/tags/}"
          VERSION="${RELEASE_TAG#v}"
          pnpm pack --pack-destination .release
          node -p "require('./package.json').name" > .release/package-name.txt
          printf '%s\n' "$VERSION" > .release/package-version.txt
          printf '%s\n' "$RELEASE_TAG" > .release/release-tag.txt
          node scripts/extract-changelog.mjs "$VERSION" > .release/release-notes.md

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: .release/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  package-type-analysis:
    name: Analyze package types
    needs: release-policy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'refs/tags/') && inputs.tag || format('refs/tags/{0}', inputs.tag)) || github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Verify package types resolve cleanly (attw)
        run: npx --yes -p @arethetypeswrong/cli@0.18.3 attw --pack . --profile node16

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm trusted publishing requires npm >= 11.5.1. The Node 24
          # toolchain carries npm 11 on GitHub-hosted runners; Node 22 can
          # still carry npm 10 and fail OIDC publishes with a misleading
          # scoped-package 404.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: .release

      # OIDC trusted publishing: npm exchanges this job's GitHub OIDC token for
      # a short-lived npm credential. No dependency install, test, build, or
      # repository script runs in this job; it only publishes the artifact
      # verified by the build job.
      #
      # Idempotent: if this exact version is already on the registry (e.g. the
      # 0.1.0 bootstrap was published manually, or this job is re-run), skip the
      # publish instead of hard-failing on npm's duplicate-version rejection.
      # A version containing a hyphen is a prerelease and goes to the `next`
      # dist-tag so it never becomes `latest`.
      - name: Publish to npm
        env:
          ALLOW_REGISTRY_ARTIFACT_MISMATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_registry_artifact_mismatch || false }}
        run: |
          NAME="$(cat .release/package-name.txt)"
          VERSION="$(cat .release/package-version.txt)"
          TARBALL="$(find .release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$TARBALL" ]; then
            echo "::error::Release artifact did not contain a package tarball."
            exit 1
          fi
          LOCAL_INTEGRITY="$(node -e "const { readFileSync } = require('node:fs'); const { createHash } = require('node:crypto'); const data = readFileSync(process.argv[1]); console.log('sha512-' + createHash('sha512').update(data).digest('base64'));" "$TARBALL")"
          LOCAL_SHASUM="$(node -e "const { readFileSync } = require('node:fs'); const { createHash } = require('node:crypto'); const data = readFileSync(process.argv[1]); console.log(createHash('sha1').update(data).digest('hex'));" "$TARBALL")"
          DIST_JSON="$(mktemp)"
          DIST_ERR="$(mktemp)"
          set +e
          npm view "$NAME@$VERSION" dist --json > "$DIST_JSON" 2> "$DIST_ERR"
          VIEW_STATUS=$?
          set -e
          if [ "$VIEW_STATUS" -eq 0 ]; then
            PUBLISHED_INTEGRITY="$(node -e "const { readFileSync } = require('node:fs'); const dist = JSON.parse(readFileSync(process.argv[1], 'utf8')); console.log(dist.integrity || '');" "$DIST_JSON")"
            PUBLISHED_SHASUM="$(node -e "const { readFileSync } = require('node:fs'); const dist = JSON.parse(readFileSync(process.argv[1], 'utf8')); console.log(dist.shasum || '');" "$DIST_JSON")"
            if [ -n "$PUBLISHED_INTEGRITY" ]; then
              EXPECTED="$LOCAL_INTEGRITY"
              OBSERVED="$PUBLISHED_INTEGRITY"
            else
              EXPECTED="sha1-$LOCAL_SHASUM"
              OBSERVED="sha1-$PUBLISHED_SHASUM"
            fi
            if [ "$EXPECTED" != "$OBSERVED" ]; then
              if [ "$ALLOW_REGISTRY_ARTIFACT_MISMATCH" = "true" ]; then
                echo "::warning::$NAME@$VERSION is already published with different bytes; bootstrap override allowed this mismatch."
                echo "::warning::Expected verified artifact integrity: $EXPECTED"
                echo "::warning::Observed registry integrity: $OBSERVED"
                echo "::notice::$NAME@$VERSION is already published; bootstrap mismatch override enabled; skipping publish."
              else
                echo "::error::$NAME@$VERSION is already published with different bytes."
                echo "::error::Expected verified artifact integrity: $EXPECTED"
                echo "::error::Observed registry integrity: $OBSERVED"
                exit 1
              fi
            else
              echo "::notice::$NAME@$VERSION is already published with matching integrity; skipping publish."
            fi
          elif ! grep -Eq 'E404|404 Not Found|is not in this registry' "$DIST_ERR"; then
            echo "::error::Unable to verify whether $NAME@$VERSION is already published."
            cat "$DIST_ERR"
            exit "$VIEW_STATUS"
          elif [[ "$VERSION" == *-* ]]; then
            npm publish "$TARBALL" --ignore-scripts --access public --provenance --tag next
          else
            npm publish "$TARBALL" --ignore-scripts --access public --provenance
          fi

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write # creates or updates the GitHub Release
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: .release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(cat .release/release-tag.txt)"
          VERSION="$(cat .release/package-version.txt)"
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file .release/release-notes.md $PRERELEASE
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file .release/release-notes.md $PRERELEASE
          fi
