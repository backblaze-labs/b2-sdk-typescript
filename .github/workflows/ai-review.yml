name: AI review

# Layers 2 and 3 of docs/review-process.md: a Claude review against REVIEW.md and a
# separate automated security review on every same-repo PR. Findings are comments,
# never approvals. Fork PRs are skipped (no secrets, and the security action is not
# hardened against prompt injection). Both jobs no-op until ANTHROPIC_API_KEY is set.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    name: claude-review
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY is not configured; skipping the AI review." >> "$GITHUB_STEP_SUMMARY"
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # later rounds diff against the last reviewed commit
          persist-credentials: false
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Review this pull request as the automated reviewer described in REVIEW.md.
            Read REVIEW.md and AGENTS.md first and follow the "AI reviewer contract"
            section exactly: severity tags, evidence, nit cap, skipped paths, rounds,
            no reposts, and the summary format. The PR branch is checked out.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate),mcp__github_inline_comment__create_inline_comment"

  security-review:
    name: security-review
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY is not configured; skipping the security review." >> "$GITHUB_STEP_SUMMARY"
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          exclude-directories: docs,intent,.changes,api-docs
          custom-security-scan-instructions: .github/security-review-instructions.txt
