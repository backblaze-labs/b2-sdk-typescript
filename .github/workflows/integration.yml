name: Integration (real B2)

# Runs the integration suite against a real Backblaze B2 account. Gated on
# repo-level secrets being present, so the job is automatically skipped on
# pull requests from forks (which can't see secrets).
#
# Required repo secrets:
#   B2_APPLICATION_KEY_ID
#   B2_APPLICATION_KEY
# Configure this as a non-master application key with bucket create/list/delete,
# file read/write/list/delete, Object Lock retention/legal-hold/bypass caps, and
# notification caps if live notification-rule tests are added.
# Required master-key secrets for the trusted main-only Partner / Backup
# live-contracts job:
#   B2_MASTER_KEY_ID
#   B2_MASTER_KEY
# Optional repo variables for manual destructive Partner provisioning tests:
#   B2_INTEGRATION_ALLOW_DESTRUCTIVE_PARTNER
#   B2_INTEGRATION_PARTNER_DESTRUCTIVE_GROUP_ID
#   B2_INTEGRATION_PARTNER_DESTRUCTIVE_GROUP_NAME
#   B2_INTEGRATION_PARTNER_DISPOSABLE_EMAIL_DOMAIN
#   B2_INTEGRATION_PARTNER_DISPOSABLE_EMAIL_DOMAIN_ACK
#   B2_INTEGRATION_ALLOW_IRREVERSIBLE_PARTNER_TRIAL
#   B2_INTEGRATION_PARTNER_TRIAL_RECONCILIATION_OWNER
# Destructive Partner and Backup allow-flags are forwarded only for
# workflow_dispatch on the first Node matrix leg, so push/schedule runs stay
# read-only.
# Optional dedicated credentials for the trusted application-key lifecycle job:
#   B2_KEY_MANAGEMENT_APPLICATION_KEY_ID
#   B2_KEY_MANAGEMENT_APPLICATION_KEY
# Optional if the key-management credential cannot list or create buckets:
#   B2_KEY_MANAGEMENT_BUCKET_ID
# When configured, the key-management credential should be a dedicated contract key with
# writeKeys, listKeys, deleteKeys, and readFiles. Do not grant the shared
# integration key key-management capabilities just to satisfy lifecycle tests.
# For full subset-rejection coverage, keep at least one other file-scopeable
# capability (for example writeFiles) out of the key-management credential.
# Recommended: scope the key to a dedicated test account. The tests create
# ephemeral `sdk-it-<timestamp>` buckets and clean up after themselves (including
# a defensive sweep at startup for stale `sdk-it-*` / legacy `sdk-test-*` buckets
# from previously-crashed runs). Same-repo runs fail if these secrets are absent
# so scheduled live-B2 evidence cannot accidentally become an all-skipped run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC. Catches drift from B2 API changes that the
    # in-memory simulator wouldn't see.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changed-files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changed-files
        uses: ./.github/actions/detect-changes
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  integration:
    name: Integration (Node ${{ matrix.node-version }})
    needs: changes
    runs-on: ubuntu-latest
    # Fork PRs can't access secrets; skip rather than fail loudly. Same-repo
    # PRs and pushes to main do run.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    strategy:
      fail-fast: false
      # Run matrix entries one at a time. The integration tests share a single
      # B2 account; serializing avoids one entry's bucket-cleanup sweep racing
      # against another entry's freshly-created bucket. Wall-clock cost is
      # ~2 min total either way.
      max-parallel: 1
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run application-key integration tests against real B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_INTEGRATION_REQUIRE_CREDENTIALS: '1'
        run: |
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "::error::B2_APPLICATION_KEY_ID / B2_APPLICATION_KEY secrets are required for same-repo real-B2 integration runs."
            exit 1
          fi
          pnpm exec vitest run --config vitest.integration.ts \
            tests/integration/b2.test.ts \
            tests/integration/live-contracts.test.ts \
            tests/integration/object-lock.test.ts

  partner-backup-live-contracts:
    name: Partner/Backup live contracts (Node ${{ matrix.node-version }})
    needs: changes
    runs-on: ubuntu-latest
    # The Master Application Key can administer the full account, so expose it
    # only to trusted code checked out from main.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Partner/Backup live contracts against real B2
        env:
          B2_MASTER_KEY_ID: ${{ secrets.B2_MASTER_KEY_ID }}
          B2_MASTER_KEY: ${{ secrets.B2_MASTER_KEY }}
          B2_INTEGRATION_ALLOW_DESTRUCTIVE_PARTNER: ${{ github.event_name == 'workflow_dispatch' && matrix.node-version == '22.22.2' && vars.B2_INTEGRATION_ALLOW_DESTRUCTIVE_PARTNER || '' }}
          B2_INTEGRATION_PARTNER_DESTRUCTIVE_GROUP_ID: ${{ vars.B2_INTEGRATION_PARTNER_DESTRUCTIVE_GROUP_ID }}
          B2_INTEGRATION_PARTNER_DESTRUCTIVE_GROUP_NAME: ${{ vars.B2_INTEGRATION_PARTNER_DESTRUCTIVE_GROUP_NAME }}
          B2_INTEGRATION_PARTNER_DISPOSABLE_EMAIL_DOMAIN: ${{ vars.B2_INTEGRATION_PARTNER_DISPOSABLE_EMAIL_DOMAIN }}
          B2_INTEGRATION_PARTNER_DISPOSABLE_EMAIL_DOMAIN_ACK: ${{ vars.B2_INTEGRATION_PARTNER_DISPOSABLE_EMAIL_DOMAIN_ACK }}
          B2_INTEGRATION_ALLOW_IRREVERSIBLE_PARTNER_TRIAL: ${{ github.event_name == 'workflow_dispatch' && matrix.node-version == '22.22.2' && vars.B2_INTEGRATION_ALLOW_IRREVERSIBLE_PARTNER_TRIAL || '' }}
          B2_INTEGRATION_PARTNER_TRIAL_RECONCILIATION_OWNER: ${{ vars.B2_INTEGRATION_PARTNER_TRIAL_RECONCILIATION_OWNER }}
          B2_INTEGRATION_ALLOW_DESTRUCTIVE_BACKUP: ${{ github.event_name == 'workflow_dispatch' && matrix.node-version == '22.22.2' && vars.B2_INTEGRATION_ALLOW_DESTRUCTIVE_BACKUP || '' }}
          B2_INTEGRATION_BACKUP_ACCOUNT_ID: ${{ vars.B2_INTEGRATION_BACKUP_ACCOUNT_ID }}
          B2_INTEGRATION_BACKUP_UNAUTHORIZED_ACCOUNT_ID: ${{ vars.B2_INTEGRATION_BACKUP_UNAUTHORIZED_ACCOUNT_ID }}
          B2_INTEGRATION_BACKUP_DISPOSABLE_ACCOUNT_ID: ${{ vars.B2_INTEGRATION_BACKUP_DISPOSABLE_ACCOUNT_ID }}
          B2_INTEGRATION_BACKUP_DISPOSABLE_COMPUTER_ID: ${{ vars.B2_INTEGRATION_BACKUP_DISPOSABLE_COMPUTER_ID }}
          B2_INTEGRATION_BACKUP_DISPOSABLE_COMPUTER_ID_ACK: ${{ vars.B2_INTEGRATION_BACKUP_DISPOSABLE_COMPUTER_ID_ACK }}
          B2_INTEGRATION_REQUIRE_MASTER_CREDENTIALS: '1'
        run: |
          if [ -z "$B2_MASTER_KEY_ID" ] || [ -z "$B2_MASTER_KEY" ]; then
            echo "::error::B2_MASTER_KEY_ID / B2_MASTER_KEY secrets are required for trusted Partner/Backup live contracts."
            exit 1
          fi
          pnpm exec vitest run --config vitest.integration.ts --no-file-parallelism \
            tests/integration/partner.test.ts \
            tests/integration/partner-backup-contracts.test.ts \
            tests/integration/backup.test.ts

  key-lifecycle:
    name: Application-key lifecycle (Node ${{ matrix.node-version }})
    needs: changes
    runs-on: ubuntu-latest
    # Key-management secrets can create/list/delete account keys, so make them
    # available only to trusted code checked out from main. Pull-request
    # code and manually-dispatched non-main refs must never receive them.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run application-key lifecycle tests against real B2
        env:
          B2_KEY_MANAGEMENT_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_MANAGEMENT_APPLICATION_KEY_ID }}
          B2_KEY_MANAGEMENT_APPLICATION_KEY: ${{ secrets.B2_KEY_MANAGEMENT_APPLICATION_KEY }}
          B2_KEY_MANAGEMENT_BUCKET_ID: ${{ secrets.B2_KEY_MANAGEMENT_BUCKET_ID }}
          B2_KEY_MANAGEMENT_REQUIRE_CREDENTIALS: '1'
        run: |
          if [ -z "$B2_KEY_MANAGEMENT_APPLICATION_KEY_ID" ] && [ -z "$B2_KEY_MANAGEMENT_APPLICATION_KEY" ]; then
            echo "::notice::B2 key-management secrets are not configured; skipping application-key lifecycle tests."
            exit 0
          fi
          if [ -z "$B2_KEY_MANAGEMENT_APPLICATION_KEY_ID" ] || [ -z "$B2_KEY_MANAGEMENT_APPLICATION_KEY" ]; then
            echo "::error::B2_KEY_MANAGEMENT_APPLICATION_KEY_ID / B2_KEY_MANAGEMENT_APPLICATION_KEY must be configured together."
            exit 1
          fi
          pnpm exec vitest run --config vitest.integration.ts tests/integration/keys.test.ts

  real-examples:
    name: Run examples against real B2 (Node ${{ matrix.node-version }})
    needs: [changes, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run after the integration suite passes so a wire-format break shows up
    # as an integration failure (sharp signal) rather than a confusing
    # example-script failure.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    strategy:
      fail-fast: false
      # Same reason as the integration job: real-examples uses a separate
      # `sdk-examples-*` bucket prefix, but we still serialize matrix entries
      # for predictable cleanup and account-level rate-limit safety.
      max-parallel: 1
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The examples import `@backblaze-labs/b2-sdk`, which resolves via the
      # package.json `exports` map to `./dist/index.js`. Build dist/ so tsx
      # can resolve the bare specifier the same way an `npm install`-ed
      # consumer would.
      - run: pnpm build
      - name: Run the documented `npx tsx examples/...` commands end-to-end
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          if [ -z "$B2_APPLICATION_KEY_ID" ] || [ -z "$B2_APPLICATION_KEY" ]; then
            echo "::error::B2_APPLICATION_KEY_ID / B2_APPLICATION_KEY secrets are required for real-example runs."
            exit 1
          fi
          npx tsx tests/real-examples/runner.ts

  integration-result:
    name: Integration result
    needs: [changes, integration, partner-backup-live-contracts, key-lifecycle, real-examples]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RUN_REAL_B2: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          RUN_MAIN_ONLY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PARTNER_BACKUP_LIVE_CONTRACTS_RESULT: ${{ needs.partner-backup-live-contracts.result }}
          KEY_LIFECYCLE_RESULT: ${{ needs.key-lifecycle.result }}
          REAL_EXAMPLES_RESULT: ${{ needs.real-examples.result }}
        run: |
          set -euo pipefail

          failed=false
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 concluded '$2'; expected success."
              failed=true
            fi
          }
          require_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "::error::$1 concluded '$2'; expected skipped."
              failed=true
            fi
          }

          require_success changes "$CHANGES_RESULT"

          if [ "$CODE_CHANGED" = "true" ] && [ "$RUN_REAL_B2" = "true" ]; then
            require_success integration "$INTEGRATION_RESULT"
            require_success real-examples "$REAL_EXAMPLES_RESULT"
          else
            require_skipped integration "$INTEGRATION_RESULT"
            require_skipped real-examples "$REAL_EXAMPLES_RESULT"
          fi

          if [ "$CODE_CHANGED" = "true" ] && [ "$RUN_MAIN_ONLY" = "true" ]; then
            require_success partner-backup-live-contracts "$PARTNER_BACKUP_LIVE_CONTRACTS_RESULT"
            require_success key-lifecycle "$KEY_LIFECYCLE_RESULT"
          else
            require_skipped partner-backup-live-contracts "$PARTNER_BACKUP_LIVE_CONTRACTS_RESULT"
            require_skipped key-lifecycle "$KEY_LIFECYCLE_RESULT"
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
